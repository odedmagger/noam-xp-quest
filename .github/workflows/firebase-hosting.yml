name: Firebase Hosting

on:
  push:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:emulator
      - run: npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.repository_id == '1459773510'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: noam-xp-quest
      FIREBASE_WEB_APP_ID: '1:693564090252:web:8f79cff0a81381f08fd8a9'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Sign in to Google Cloud
        id: firebase_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: noam-xp-quest
          workload_identity_provider: projects/693564090252/locations/global/workloadIdentityPools/github-hosting/providers/main
          service_account: github-hosting-deployer@noam-xp-quest.iam.gserviceaccount.com
          token_format: access_token
      - name: Verify live rules and load Web SDK configuration
        run: node scripts/prepare-firebase-ci.mjs
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
      - name: Deploy Hosting
        run: npm exec -- firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Verify deployed build
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "https://${FIREBASE_PROJECT_ID}.web.app/?release=${GITHUB_SHA}" \
            --output "$RUNNER_TEMP/firebase-live-index.html"
          cmp dist/index.html "$RUNNER_TEMP/firebase-live-index.html"
